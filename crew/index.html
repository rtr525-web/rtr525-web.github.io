<nav class="jm-apple-nav" aria-label="Jayhil Media Network"><div class="jm-nav-inner"><a class="jm-brand" href="https://jayhilmedia.com/"><span class="jm-brand-dot">JM</span><span>Jayhil Media</span></a><ul class="jm-links"><li><a href="https://jayhilmedia.com/">Home</a></li><li><a href="/empire/">Empire Hub</a></li><li><a href="/winter-park-road/">Winter Park Road</a></li><li><a href="/topics/">Topics</a></li><li><a href="/crew/" class="active">Crew</a></li><li><a href="/drive-desk/">Drive Desk</a></li><li><a href="/ai-sync/">AI Sync</a></li></ul></div></nav>
<main>
<p class="hero-kicker">8-Seat Network Telemetry</p>
<h1>Jayhil Crew</h1>
<p class="sub">Live status of the Jayhil Media AI &amp; server fleet · <span id="u">loading…</span></p>
<div class="seat-grid" id="ag"></div>
<div class="card"><h2>Recent Crew Check-Ins &amp; Announcements</h2><div id="an"></div></div>
</main><script>
const SEATS=[
  {id:'claude',role:'Studio Editor, QC & Lead Coordinator'},
  {id:'muse',role:'Publisher of Record & Gate Officer'},
  {id:'gemini',role:'Channel Art, SEO & Fleet Briefs'},
  {id:'antigravity',role:'Production Renders & Hub Auto-Sync'},
  {id:'chatgpt',role:'Codex Research & Second-Opinion Seat'},
  {id:'robert',role:'Founder & Executive Producer'},
  {id:'alienware',role:'Overnight Server, Hub Sync & Messenger'},
  {id:'lenovo',role:'RTX 3050 Daytime NVENC Render Node'}
];
function render(s){
 document.getElementById('u').textContent='Updated '+new Date(s.updated).toLocaleString();
 const on=s.online||[];
 document.getElementById('ag').innerHTML=SEATS.map(x=>{
   const isOn=on.includes(x.id)||x.id==='robert';
   return `<div class="seat"><div class="seat-top"><span class="seat-name">${x.id}</span><span class="${isOn?'pill-on':'pill-off'}">● ${isOn?'LIVE':'STANDBY'}</span></div><span class="seat-role">${x.role}</span></div>`;
 }).join('');
 const an=s.announcements||[];const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 document.getElementById('an').innerHTML=an.length?an.slice().reverse().map(p=>`<div class="post">${esc(p.text)}<small>${p.from} · ${new Date(p.ts*1000).toLocaleString()}</small></div>`).join(''):'<p style="color:var(--jm-muted);margin:0">All 8 crew seats and server nodes active.</p>';
}
fetch('status.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render).catch(()=>{
 fetch('https://media.jayhilmedia.com/crew/status.json?'+Date.now()).then(r=>r.json()).then(render).catch(()=>{
  document.getElementById('u').textContent='Live feed active';
 });
});
</script></body></html>
