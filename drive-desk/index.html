function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function hex(s){var u=new Uint8Array(s.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(s.substr(i*2,2),16);return u;}
async function tryKey(rawKey){
  var key = await crypto.subtle.importKey('raw', rawKey, {name:'AES-GCM'}, true, ['decrypt']);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(IV_B64)}, key, b64(DATA_B64));
  return new TextDecoder().decode(pt);
}
function render(html){ document.open(); document.write(html); document.close(); }
async function unlock(pin){
  var enc = new TextEncoder().encode(pin);
  var base = await crypto.subtle.importKey('raw', enc, 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt: hex(SALT_HEX), iterations: ITER, hash:'SHA-256'}, base, 256);
  var raw = new Uint8Array(bits);
  var html = await tryKey(raw);
  var b64key = btoa(String.fromCharCode.apply(null, Array.from(raw)));
  try { localStorage.setItem('jm_hub_key', b64key); } catch(e) {}
  try { document.cookie = 'jm_hub_key=' + encodeURIComponent(b64key) + '; domain=.jayhilmedia.com; path=/; max-age=31536000; Secure; SameSite=Lax'; } catch(e) {}
  render(html);
}
(async function(){
  var saved = null;
  try { saved = localStorage.getItem('jm_hub_key'); } catch(e) {}
  if (!saved) { try { var m = document.cookie.match(/(?:^|; )jm_hub_key=([^;]*)/); if (m) saved = decodeURIComponent(m[1]); } catch(e) {} }
  if (saved) {
    try { render(await tryKey(b64(saved))); return; } catch(e) { try{localStorage.removeItem('jm_hub_key');}catch(_){} }
  }
  document.getElementById('pin').focus();
})();
document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var pin = document.getElementById('pin').value.trim();
  var err = document.getElementById('err');
  err.textContent = '';
  try { await unlock(pin); }
  catch(e) { err.textContent = 'Incorrect PIN.'; document.getElementById('pin').value=''; }
});
</script>
